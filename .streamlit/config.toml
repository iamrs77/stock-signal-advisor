# Project Streamlit settings, so every launch looks and behaves the same.
[browser]
gatherUsageStats = false

# server.headless is left at Streamlit's default: it opens a browser tab on Windows and macOS,
# and runs headless on Linux servers such as Streamlit Community Cloud. Setting it to false here
# makes Streamlit wait for an onboarding prompt on the server, so the app never starts there.
[server]
port = 8501

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1A2233"
baseRadius = "0.75rem"
borderColor = "#E5E9F0"
font = "sans serif"
